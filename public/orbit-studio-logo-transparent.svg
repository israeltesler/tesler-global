<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="orbitMain" x1="310" y1="195" x2="705" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#D9DDE2"/>
      <stop offset="0.72" stop-color="#7D838B"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="orbitThin" x1="270" y1="500" x2="745" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#777D85"/>
      <stop offset="0.28" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#E7E9EC"/>
      <stop offset="1" stop-color="#777D85"/>
    </linearGradient>
    <radialGradient id="orbitGlow">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <circle
    cx="500"
    cy="375"
    r="184"
    stroke="url(#orbitMain)"
    stroke-width="13"
    stroke-linecap="round"
    transform="rotate(-18 500 375)"
  />
  <ellipse
    cx="500"
    cy="400"
    rx="252"
    ry="92"
    stroke="url(#orbitThin)"
    stroke-width="4"
    transform="rotate(-25 500 400)"
  />
  <circle cx="641" cy="267" r="38" fill="url(#orbitGlow)" filter="url(#softGlow)"/>
  <circle cx="641" cy="267" r="11" fill="#FFFFFF"/>

  <text
    x="500"
    y="705"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="112"
    font-weight="300"
    letter-spacing="46"
    text-anchor="middle"
  >TESLER</text>

  <line x1="178" y1="773" x2="282" y2="773" stroke="#BFC4CA" stroke-width="2"/>
  <line x1="718" y1="773" x2="822" y2="773" stroke="#BFC4CA" stroke-width="2"/>
  <text
    x="500"
    y="790"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="300"
    letter-spacing="31"
    text-anchor="middle"
  >STUDIO</text>
</svg>
